name: Build Komisar AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Komisar AI" "ua.komisar.ai" --web-dir dist || true
          npx cap add android

      - name: Inject Notification Interceptor & Permissions
        run: |
          mkdir -p android/app/src/main/java/ua/komisar/ai
          cp android-native/KomisarNotificationService.kt android/app/src/main/java/ua/komisar/ai/
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" \/>\n    <application/' "$MANIFEST"
          SERVICE_XML='<service android:name=".KomisarNotificationService" android:label="Комісар ШІ Захист" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService" \/><\/intent-filter><\/service>'
          sed -i "s/<\/application>/$SERVICE_XML\n    <\/application>/" "$MANIFEST"
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload KomisarAI APK
        uses: actions/upload-artifact@v4
        with:
          name: KomisarAI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
